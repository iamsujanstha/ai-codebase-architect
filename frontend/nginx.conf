# This Nginx config serves two roles:
# 1. Serve the compiled React single-page application.
# 2. Proxy API traffic to the backend container.
#
# Why proxy through Nginx?
# - The browser can talk to one origin (`localhost:8080`).
# - We avoid hard-coding internal Docker hostnames in browser code.
# - This is a very common production deployment pattern.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Forward AI API requests to the NestJS gateway.
  location /ai/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Forward ecommerce catalog API requests to the same backend gateway.
  # This lets the browser stay on one origin while the backend still owns
  # business logic and database access.
  location /catalog/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Forward checkout and payment orchestration traffic to the backend service.
  # The browser still sees one origin, while Stripe/eSewa logic stays server-side.
  location /payments/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Expose backend health checks through the same entry point for convenience.
  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Single-page applications need unknown routes to resolve back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
