<style>

button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}

input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--brand)}

.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:20px}

.pt .mc{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;border:0;border-radius:999px;background:var(--bg);padding:2px 8px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tg{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;display:flex;gap:6px;align-items:center}.tg button{border:0;background:none;color:var(--mute)}

.rd{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}.rd:has(input:checked){border:2px solid var(--ink);padding:13px}.rd b{display:block}.rd small{color:var(--mute)}
.pv{position:sticky;top:76px}.pv h3{margin:0 0 10px;font-size:12px;color:var(--mute);letter-spacing:.05em}
.card .img{position:relative;aspect-ratio:20/19;border-radius:14px;display:grid;place-items:center;font-size:72px;background-size:cover;background-position:center}.card .bd{position:absolute;left:12px;top:12px;background:var(--bg);font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card .meta{padding-top:10px}.card .row{display:flex;justify-content:space-between;gap:8px;font-weight:600}.card s{color:var(--mute);margin-left:6px}
.ck{border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}.ck .pb{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 12px}.ck .pb i{display:block;height:100%;background:var(--brand)}
.ck div.it{display:flex;gap:10px;font-size:14px;padding:3px 0;color:var(--mute)}.ck .it.ok{color:var(--ink)}.ck .it span:first-child{width:18px;text-align:center;color:var(--ok)}
.foot{position:sticky;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);margin:0 calc(-1*clamp(16px,3vw,40px));padding:14px clamp(16px,3vw,40px) calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 20px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:16px}.modal{background:var(--bg);border-radius:20px;width:min(1000px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.lg{min-height:100vh;display:grid;place-items:center;padding:24px}.lc{width:min(420px,100%);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px}.lc .f{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}.toast.on{opacity:1}
@media (max-width:1000px){.ed{grid-template-columns:1fr}.pv{position:static}}
@media (max-width:860px){.shell{grid-template-columns:1fr}.sb{position:fixed;z-index:50;width:272px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}.sb.open{transform:none}.hb{display:block}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.btn.d{border-color:var(--bad);background:var(--bad);color:#fff}.btn.d:hover{opacity:.9;background:var(--bad)}
.dsc{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--bg);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);font-size:18px}.icon{width:36px;height:36px;border-radius:50%;border:0;background:none}.icon:hover{background:var(--soft)}
.dr .db{flex:1;overflow:auto;padding:22px 24px}.dr .df{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.up{margin-top:8px;display:flex;gap:14px;align-items:center}.pvimg{width:96px;height:96px;border-radius:14px;background-size:cover;background-position:center;border:1px solid var(--line);flex:none}
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:28px}.cardb{border:1px solid var(--line);border-radius:16px;padding:20px}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;margin-top:16px}.chart>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--mute)}.chart i{display:block;width:100%;border-radius:8px 8px 0 0;background:linear-gradient(var(--brand),#a93bff);min-height:4px}
.ul>div{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.ul>div:last-child{border:0}.ul .t{flex:1;min-width:0}.ul .t b,.ul .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel2{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:14px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
</style>
</head>

<script>

function go(v){A.view=v;$('sb').classList.remove('open');nav();$('main').innerHTML=({dash:dash,products:products,users:users}[v])();if(v!==A.last)window.scrollTo(0,0);A.last=v}

function dash(){var live=P.filter(function(p){return p.status==='live'}).length,low=P.filter(function(p){return p.stock<=5}),val=[420,610,380,900,760,1240,980],day=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],mx=1240,rec=U.slice().reverse().slice(0,4);
 return '<h1>Good to see you, Sujan</h1><p class="sub">A quick look at your store.</p><div class="stats"><div class="stat"><b>'+P.length+'</b><span>Total products</span></div><div class="stat"><b>'+live+'</b><span>Published</span></div><div class="stat"><b>'+U.length+'</b><span>Users</span></div><div class="stat"><b>$12,480</b><span>Revenue, last 30 days</span></div></div>'
 +'<div class="two"><div class="cardb"><h2>Sales, last 7 days</h2><span class="sub">Total $5,290</span><div class="chart">'+val.map(function(v,i){return '<div><i style="height:'+Math.round(v/mx*100)+'%" title="$'+v+'"></i>'+day[i]+'</div>'}).join('')+'</div></div>'
 +'<div class="cardb"><div style="display:flex;justify-content:space-between;align-items:center"><h2>New users</h2><button class="btn s g" data-n="users">View all</button></div><div class="ul">'+rec.map(function(u){return '<div>'+ava(u)+'<div class="t"><b>'+esc(u.name)+'</b><span class="sub">'+esc(u.email)+'</span></div></div>'}).join('')+'</div></div></div>'
 +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">Low stock</h2><button class="btn p s" data-a="new">+ Add product</button></div><div class="att">'+(low.map(function(p){return '<div>'+thumb(p)+'<div class="t"><b>'+esc(p.title)+'</b><div class="sub">'+(p.stock?'Only '+p.stock+' left':'Out of stock')+'</div></div><button class="btn s" data-a="edit" data-id="'+p.id+'">Restock</button></div>'}).join('')||'<div class="sub">All products are well stocked.</div>')+'</div>'}

function products(){var q=A.q.toLowerCase(),l=P.filter(function(p){return(A.f==='all'||p.status===A.f)&&(!q||(p.title+' '+CATS[p.cat]+' '+p.sku).toLowerCase().indexOf(q)>-1)});l.sort(function(a,b){var x=a[A.sk],y=b[A.sk];return(x>y?1:x<y?-1:0)*A.dir});
 var n={all:P.length,live:0,draft:0};P.forEach(function(p){n[p.status]++});var F=[['all','All'],['live','Published'],['draft','Drafts']],th=function(k,t){return '<th><button data-s="'+k+'">'+t+(A.sk===k?(A.dir>0?' ↑':' ↓'):'')+'</button></th>'};
 return '<div class="bar" style="margin-top:0"><div><h1>Products</h1><p class="sub" style="margin:0">Create, edit and remove what shoppers see in the store.</p></div><button class="btn p" data-a="new">+ Add product</button></div><div class="bar"><div class="seg">'+F.map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(A.f===f[0])+'">'+f[1]+' '+n[f[0]]+'</button>'}).join('')+'</div><input class="search" id="sq" placeholder="Search name or SKU" aria-label="Search products" value="'+esc(A.q)+'"></div>'
 +'<div class="tw"><table><thead><tr>'+th('title','Product')+th('cat','Category')+th('price','Price')+th('stock','Stock')+th('status','Status')+'<th></th></tr></thead><tbody>'
 +(l.length?l.map(function(p){return '<tr><td><div class="li">'+thumb(p)+'<div><b>'+esc(p.title)+'</b><span>'+p.sku+'</span></div></div></td><td>'+CATS[p.cat]+'</td><td>$'+p.price+'</td><td>'+stockH(p.stock)+'</td><td><span class="st '+(p.status==='live'?'live':'draft')+'">'+(p.status==='live'?'Published':'Draft')+'</span></td><td style="white-space:nowrap;text-align:right"><button class="btn s" data-a="edit" data-id="'+p.id+'">Edit</button> <button class="btn s g" data-a="del" data-id="'+p.id+'" style="color:var(--bad)">Delete</button></td></tr>'}).join(''):'<tr><td colspan="6"><div class="empty"><b>No products found</b>Try another filter, or add a product.</div></td></tr>')+'</tbody></table></div>'}

function users(){var q=A.uq.toLowerCase(),l=U.filter(function(u){return(A.uf==='all'||u.role===A.uf)&&(!q||(u.name+' '+u.email).toLowerCase().indexOf(q)>-1)});
 var F=[['all','All users'],['customer','Customers'],['admin','Admins']];
 return '<div class="bar" style="margin-top:0"><div><h1>Users</h1><p class="sub" style="margin:0">'+U.length+' registered accounts</p></div></div><div class="bar"><div class="seg">'+F.map(function(f){return '<button data-uf="'+f[0]+'" aria-pressed="'+(A.uf===f[0])+'">'+f[1]+'</button>'}).join('')+'</div><input class="search" id="uq" placeholder="Search name or email" aria-label="Search users" value="'+esc(A.uq)+'"></div>'
 +'<div class="tw"><table><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Orders</th><th>Joined</th><th></th></tr></thead><tbody>'
 +(l.length?l.map(function(u){var me=u.id===1;return '<tr><td><div class="li" style="min-width:220px">'+ava(u)+'<div><b>'+esc(u.name)+(me?' <span class="pm">You</span>':'')+'</b><span>'+esc(u.email)+'</span></div></div></td><td><select class="sel2" data-role="'+u.id+'" aria-label="Role for '+esc(u.name)+'"'+(me?' disabled':'')+'><option value="customer"'+(u.role==='customer'?' selected':'')+'>Customer</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>Admin</option></select></td><td><span class="st '+(u.status==='active'?'live':'warn')+'">'+(u.status==='active'?'Active':'Suspended')+'</span></td><td>'+u.orders+'</td><td class="sub">'+u.joined+'</td><td style="text-align:right">'+(me?'':'<button class="btn s g" data-a="susp" data-id="'+u.id+'">'+(u.status==='active'?'Suspend':'Reactivate')+'</button>')+'</td></tr>'}).join(''):'<tr><td colspan="6"><div class="empty"><b>No users found</b></div></td></tr>')+'</tbody></table></div>'}

/* product drawer (create / edit) */
function fld(l,k,o){o=o||{};var v=A.E[k];return '<label class="f">'+l+'<span class="ib">'+(o.pre?'<i>'+o.pre+'</i>':'')+'<input data-k="'+k+'" type="'+(o.t||'text')+'" value="'+esc(v)+'" placeholder="'+(o.ph||'')+'"'+(o.t==='number'?' min="0" step="1"':'')+'></span><span class="err" id="x-'+k+'"></span></label>'}
function dr(){var E=A.E;return '<div class="dh"><b>'+(A.isNew?'Add product':'Edit product')+'</b><button class="icon" data-a="close" aria-label="Close">✕</button></div><div class="db"><div class="f">Image<div class="up">'+(E.img?'<div class="pvimg" style="background-image:url('+E.img+')"></div><div><button class="btn s g" data-a="pick">Replace</button> <button class="btn s g" data-a="rmimg">Remove</button></div>':'<button class="btn g" data-a="pick" style="width:100%;padding:26px">Upload image</button>')+'</div><input type="file" id="fi" accept="image/*" hidden></div>'
 +fld('Product name','title',{ph:'e.g. Walnut standing desk'})+'<label class="f">Category<span class="ib"><select data-k="cat">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(E.cat===k?' selected':'')+'>'+CATS[k]+'</option>'}).join('')+'</select></span></label>'
 +'<div class="g2">'+fld('Price','price',{t:'number',pre:'$',ph:'0'})+fld('Stock','stock',{t:'number',ph:'0'})+'</div>'
 +'<label class="f">Description<span class="ib"><textarea data-k="desc" rows="5" placeholder="What makes it great?">'+esc(E.desc)+'</textarea></span></label>'
 +'<label class="f">Status<span class="ib"><select data-k="status"><option value="live"'+(E.status==='live'?' selected':'')+'>Published: visible in the store</option><option value="draft"'+(E.status==='draft'?' selected':'')+'>Draft: hidden from shoppers</option></select></span></label></div>'
 +'<div class="df"><button class="btn g" data-a="close">Cancel</button><button class="btn p" data-a="save">'+(A.isNew?'Create product':'Save changes')+'</button></div>'}
function openDr(id){var p=P.filter(function(x){return x.id==id})[0];A.isNew=!p;A.dirty=false;A.E=p?JSON.parse(JSON.stringify(p)):{id:0,title:'',cat:'desk',price:'',stock:'',status:'live',desc:'',img:'',g:Math.floor(Math.random()*6),sku:'ATL-'+(1000+Math.floor(Math.random()*9000))};$('dr').innerHTML=dr();$('dr').hidden=$('dsc').hidden=false}
function closeDr(){if(!$('dr').hidden&&A.dirty&&!confirm('Discard your changes?'))return false;$('dr').hidden=$('dsc').hidden=true;return true}
function save(){var E=A.E,ok=true;E.title=E.title.trim();
 [['title',E.title.length<3,'Enter a product name'],['price',!(+E.price>0),'Enter a price above 0'],['stock',E.stock===''||+E.stock<0,'Enter the stock quantity']].forEach(function(c){$('x-'+c[0]).textContent=c[1]?c[2]:'';if(c[1])ok=false});if(!ok)return;
 E.price=+E.price;E.stock=+E.stock;if(A.isNew){E.id=Date.now();P.unshift(E)}else P[P.findIndex(function(p){return p.id===E.id})]=E;
 A.dirty=false;closeDr();toast(A.isNew?'Product created':'Changes saved');nav();go(A.view)}
function confirmDel(id){var p=P.filter(function(x){return x.id==id})[0];$('modal').hidden=false;$('modal').innerHTML='<div class="modal" role="alertdialog" aria-label="Delete product" style="width:min(420px,100%)"><h2>Delete this product?</h2><p class="sub">"'+esc(p.title)+'" will be removed from the store. This cannot be undone.</p><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px"><button class="btn g" data-a="x">Cancel</button><button class="btn d" data-a="yes" data-id="'+id+'">Delete</button></div></div>'}

/* events */
$('lf').onsubmit=function(e){e.preventDefault();$('login').hidden=true;$('app').hidden=false;go('dash')};
document.querySelectorAll('.lc a').forEach(function(a){a.onclick=function(e){e.preventDefault();toast(a.dataset.t)}});
$('out').onclick=function(){$('app').hidden=true;$('login').hidden=false};$('tostore').onclick=function(){toast('Opens the storefront in a new tab')};
$('hb').onclick=function(){$('sb').classList.toggle('open')};
$('th').onclick=function(){var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};
$('nav').onclick=function(e){var b=e.target.closest('[data-n]');if(b)go(b.dataset.n)};
$('dsc').onclick=closeDr;
document.onkeydown=function(e){if(e.key==='Escape'){if(!$('modal').hidden)$('modal').hidden=true;else closeDr();$('sb').classList.remove('open')}};
$('modal').onclick=function(e){var a=e.target.dataset.a;if(e.target===this||a==='x')this.hidden=true;if(a==='yes'){var id=e.target.dataset.id;P=P.filter(function(p){return p.id!=id});this.hidden=true;toast('Product deleted');nav();go('products')}};
$('main').onclick=function(e){var t=e.target,a=t.closest('[data-a]'),n=t.closest('[data-n]');
 if(n)return go(n.dataset.n);
 if(t.closest('[data-f]')){A.f=t.closest('[data-f]').dataset.f;go('products')}
 if(t.closest('[data-uf]')){A.uf=t.closest('[data-uf]').dataset.uf;go('users')}
 if(t.closest('[data-s]')){var k=t.closest('[data-s]').dataset.s;A.dir=A.sk===k?-A.dir:1;A.sk=k;go('products')}
 if(!a)return;var v=a.dataset.a,id=a.dataset.id;
 if(v==='new')openDr();if(v==='edit')openDr(id);if(v==='del')confirmDel(id);
 if(v==='susp'){var u=U.filter(function(x){return x.id==id})[0];u.status=u.status==='active'?'suspended':'active';toast(u.status==='active'?'Account reactivated':'Account suspended');go('users')}};
$('main').onchange=function(e){var t=e.target;if(t.dataset.role){var u=U.filter(function(x){return x.id==t.dataset.role})[0];u.role=t.value;toast(u.name+' is now '+(u.role==='admin'?'an admin':'a customer'))}};
$('main').oninput=function(e){var t=e.target;if(t.id==='sq'||t.id==='uq'){var isP=t.id==='sq';if(isP)A.q=t.value;else A.uq=t.value;go(isP?'products':'users');var s=$(t.id);s.focus();s.setSelectionRange(99,99)}};
$('dr').onclick=function(e){var a=e.target.closest('[data-a]');if(!a)return;var v=a.dataset.a;
 if(v==='close')closeDr();if(v==='save')save();if(v==='pick')$('fi').click();
 if(v==='rmimg'){A.E.img='';A.dirty=true;$('dr').innerHTML=dr()}};
$('dr').onchange=function(e){if(e.target.id==='fi'&&e.target.files[0]){A.E.img=URL.createObjectURL(e.target.files[0]);A.dirty=true;$('dr').innerHTML=dr()}};
$('dr').oninput=function(e){var k=e.target.dataset.k;if(!k)return;A.E[k]=e.target.value;A.dirty=true;var x=$('x-'+k);if(x)x.textContent=''};
</script>
</body>
