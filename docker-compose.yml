name: atlas-commerce-lab

# Production logging configuration: caps log file growth to prevent disk exhaustion
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =========================================================
  # 1. FRONTEND (React SPA + Nginx Reverse Proxy)
  # =========================================================
  # Acts as the primary ingress point.
  # Serves compiled static assets and reverse-proxies /ai
  # requests directly to the backend.
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging
    networks:
      - app-network

  # =========================================================
  # 2. BACKEND (NestJS API Gateway)
  # =========================================================
  # Core application business logic, auth, catalog, payments,
  # and streaming AI orchestration.
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    ports:
      - "${BACKEND_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}

      # AI Service & Vector Integrations
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-600000}
      AI_SERVICE_STREAM_TIMEOUT_MS: ${AI_SERVICE_STREAM_TIMEOUT_MS:-600000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # Primary Database (PostgreSQL / Neon)
      DATABASE_MODE: ${DATABASE_MODE:-postgres-only}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      STORE_SEED_ON_BOOT: ${STORE_SEED_ON_BOOT:-true}

      # Public URLs
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:8080}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}

      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8000/auth/google/callback}

      # Email (SMTP)
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-"Atlas Commerce Lab" <noreply@atlascommerce.dev>}

      # Payments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      STRIPE_SHIPPING_FEE_USD: ${STRIPE_SHIPPING_FEE_USD:-0}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-8gBm/:&EnhH.1/q(}
      ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      ESEWA_STATUS_CHECK_URL: ${ESEWA_STATUS_CHECK_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}
      ESEWA_TAX_AMOUNT_NPR: ${ESEWA_TAX_AMOUNT_NPR:-0}
      ESEWA_SERVICE_CHARGE_NPR: ${ESEWA_SERVICE_CHARGE_NPR:-0}
      ESEWA_DELIVERY_CHARGE_NPR: ${ESEWA_DELIVERY_CHARGE_NPR:-0}

    depends_on:
      ai-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network

  # =========================================================
  # 3. AI SERVICE (FastAPI Inference & Orchestration Engine)
  # =========================================================
  # Production FastAPI engine running multi-worker Uvicorn.
  # Mounts removed for container immutability.
  # =========================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${AI_SERVICE_PORT:-8001}:8000"
    environment:
      APP_NAME: AI Code Assistant Engine
      PORT: 8000
      BACKEND_URL: http://backend:3000

      # Model Provider Settings
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-deepseek-coder:6.7b}
      AI_MODELS: ${AI_MODELS:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # Local Inference & Vector Store
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-pgvector}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RETRIEVAL_CORPUS: ${RETRIEVAL_CORPUS:-reference}
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-knowledge}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - app-network

# =========================================================
# NETWORKS
# =========================================================
networks:
  app-network:
    driver: bridge
