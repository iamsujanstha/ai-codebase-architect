version: "3.9"

# Project name shown in Docker Desktop and used for container grouping
name: ai-code-assistant-platform

services:
  # =========================================================
  # AI SERVICE (Python / FastAPI or Flask)
  # =========================================================
  # This service handles AI-related processing such as:
  # - prompt analysis
  # - architecture suggestions
  # - code explanation
  # - simulated or real LLM orchestration
  #
  # In production, this could be replaced by:
  # - OpenAI wrapper service
  # - LangGraph orchestration layer
  # - internal inference engine
  # =========================================================
  # =========================================================
  # AI SERVICE (Python / FastAPI or Flask)
  # =========================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: ai-code-assistant-ai-service

    environment:
      APP_NAME: AI Code Assistant Engine
      PROVIDER_NAME: ollama-local
      OLLAMA_MODEL: deepseek-coder:6.7b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: 120
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      MEMORY_COLLECTION: conversations
      REDIS_URL: redis://redis:6379/0
      PORT: 8000

    ports:
      - "8000:8000"

    # Real runtime command
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    # Wait until Vector DB and Redis are started
    depends_on:
      - vector-db
      - redis

    # Health check ensures the service is actually responding
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - assistant-network

  # =========================================================
  # AI WORKER (The 'Job Brain')
  # =========================================================
  # This service runs the same code as ai-service but acts as
  # a background processor for heavy tasks (like bulk embeddings).
  # =========================================================
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: ai-code-assistant-worker

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0

    # Start the RQ worker process instead of the FastAPI app
    command: rq worker ai_tasks --url redis://redis:6379/0

    depends_on:
      - redis
      - vector-db

    networks:
      - assistant-network


  # =========================================================
  # REDIS (Task Queue / Cache)
  # =========================================================
  # Used for async background jobs like bulk embeddings.
  # =========================================================
  redis:
    image: redis:alpine
    container_name: ai-code-assistant-redis
    ports:
      - "6379:6379"
    networks:
      - assistant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # MONITORING (Dozzle)
  # =========================================================
  # Lightweight real-time log viewer for all containers.
  # Access at http://localhost:8888
  # =========================================================
  monitoring:
    image: amir20/dozzle:latest
    container_name: ai-code-assistant-monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - assistant-network

  # =========================================================
  # VECTOR DATABASE (Qdrant)
  # =========================================================
  # Used for the "AI Memory Layer".
  # Stores embeddings of conversation history and knowledge
  # for Retrieval-Augmented Generation (RAG).
  # =========================================================
  vector-db:
    image: qdrant/qdrant:latest
    container_name: ai-code-assistant-vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage:z
    networks:
      - assistant-network

  # =========================================================


  # BACKEND (NestJS / Node.js)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-code-assistant-backend

    environment:
      PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: 120000
      AI_SERVICE_STREAM_TIMEOUT_MS: 300000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173

    ports:
      - "3000:3000"

    # Wait until AI service is healthy
    depends_on:
      ai-service:
        condition: service_healthy

    # Real runtime command
    command: npm run start:prod

    # Health check using Node built-in fetch (Node 20+)
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - assistant-network

  # =========================================================
  # FRONTEND (React + Nginx)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai-code-assistant-frontend

    ports:
      - "8080:80"

    # Wait until backend is healthy
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - assistant-network

# =========================================================
# NETWORK & VOLUMES
# =========================================================
networks:
  assistant-network:
    driver: bridge

volumes:
  qdrant_data:
