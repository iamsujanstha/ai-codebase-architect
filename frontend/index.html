<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Atlas Commerce Lab: a premium ecommerce storefront plus a local AI concierge, built with React, NestJS, MongoDB, FastAPI, and Docker Compose."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Atlas Commerce Lab</title>
    <!-- Figtree font - Airbnb-style design -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var storedTheme = window.localStorage.getItem('theme') || window.localStorage.getItem('ai-code-assistant:theme');
          var theme = storedTheme === 'light' || storedTheme === 'dark' 
            ? storedTheme 
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme !== 'light') {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      React renders the application into this root element.
      You can think of this as the "dock" where the JavaScript app attaches itself.
    -->
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
