# Project name shown in Docker Desktop and used for container grouping
name: atlas-commerce-lab

services:
  # =========================================================
  # MAILPIT (Local SMTP + Web UI for email testing)
  # =========================================================
  # Catches all outgoing emails so nothing is accidentally sent
  # to real addresses during development.
  # SMTP:   localhost:1025  (backend connects here)
  # Web UI: http://localhost:8025  (view emails in browser)
  # =========================================================
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - assistant-network

  # =========================================================
  # MONGODB (Primary application database)
  # =========================================================
  # The NestJS backend uses Mongoose and can point either to:
  # - this local MongoDB container for zero-config development
  # - a MongoDB Atlas URI provided via environment variables
  #
  # Why keep a local Mongo container even though Atlas is supported?
  # Because teaching projects should still run out of the box.
  # =========================================================
#  mongo:
#    image: mongo:7
#    ports:
#      - "27017:27017"
#    volumes:
#      - mongo_data:/data/db
#    healthcheck:
#      test:
#        [
#          "CMD",
#          "mongosh",
#          "--quiet",
#          "--eval",
#          "db.adminCommand('ping').ok"
#        ]
#      interval: 15s
#      timeout: 10s
#      retries: 5
#      start_period: 15s
#    networks:
#      - assistant-network


  # =========================================================
  # AI SERVICE (Python / FastAPI or Flask)
  # =========================================================
  # This service handles AI-related processing such as:
  # - prompt analysis
  # - architecture suggestions
  # - code explanation
  # - simulated or real LLM orchestration
  #
  # In production, this could be replaced by:
  # - OpenAI wrapper service
  # - LangGraph orchestration layer
  # - internal inference engine
  # =========================================================
  # =========================================================
  # AI SERVICE (Python / FastAPI or Flask)
  # =========================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    environment:
      APP_NAME: AI Code Assistant Engine
      PROVIDER_NAME: ollama-local
      OLLAMA_MODEL: deepseek-coder:6.7b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: 600
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      MEMORY_COLLECTION: conversations
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      BACKEND_URL: http://backend:3000

    ports:
      - "8000:8000"

    # Real runtime command
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    # Wait until Vector DB and Redis are started
    depends_on:
      - vector-db
      - redis

    # Health check ensures the service is actually responding
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - assistant-network

  # =========================================================
  # AI WORKER (The 'Job Brain')
  # =========================================================
  # This service runs the same code as ai-service but acts as
  # a background processor for heavy tasks (like bulk embeddings).
  # =========================================================
  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: vector-db
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0

    # Start the RQ worker process instead of the FastAPI app
    command: rq worker ai_tasks --url redis://redis:6379/0

    depends_on:
      - redis
      - vector-db

    networks:
      - assistant-network


  # =========================================================
  # REDIS (Task Queue / Cache)
  # =========================================================
  # Used for async background jobs like bulk embeddings.
  # =========================================================
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - assistant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # MONITORING (Dozzle)
  # =========================================================
  # Lightweight real-time log viewer for all containers.
  # Access at http://localhost:8888
  # =========================================================
  monitoring:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - assistant-network

  # =========================================================
  # VECTOR DATABASE (Qdrant)
  # =========================================================
  # Used for the "AI Memory Layer".
  # Stores embeddings of conversation history and knowledge
  # for Retrieval-Augmented Generation (RAG).
  # =========================================================
  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage:z
    networks:
      - assistant-network

  # =========================================================


  # BACKEND (NestJS / Node.js)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: 600000
      AI_SERVICE_STREAM_TIMEOUT_MS: 600000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ai_commerce_platform}
      MONGODB_AUTO_INDEX: ${MONGODB_AUTO_INDEX:-true}
      STORE_SEED_ON_BOOT: ${STORE_SEED_ON_BOOT:-true}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:8080}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
      STRIPE_SHIPPING_FEE_USD: ${STRIPE_SHIPPING_FEE_USD:-0}
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-8gBm/:&EnhH.1/q(}
      ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      ESEWA_STATUS_CHECK_URL: ${ESEWA_STATUS_CHECK_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}
      ESEWA_TAX_AMOUNT_NPR: ${ESEWA_TAX_AMOUNT_NPR:-0}
      ESEWA_SERVICE_CHARGE_NPR: ${ESEWA_SERVICE_CHARGE_NPR:-0}
      ESEWA_DELIVERY_CHARGE_NPR: ${ESEWA_DELIVERY_CHARGE_NPR:-0}
      # Mail — uses .env values; falls back to Mailpit for zero-config local testing
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-"Atlas Commerce Lab" <noreply@atlascommerce.dev>}

    ports:
      - "3000:3000"

    # Wait until AI service is healthy
    depends_on:
      ai-service:
        condition: service_healthy
      mailpit:
        condition: service_started


    # Real runtime command
    command: npm run start:prod

    # Health check using Node built-in fetch (Node 20+)
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - assistant-network

  # =========================================================
  # FRONTEND (React + Nginx)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    # Wait until backend is healthy
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - assistant-network

# =========================================================
# NETWORK & VOLUMES
# =========================================================
networks:
  assistant-network:
    driver: bridge

volumes:
  qdrant_data:
  mongo_data:
